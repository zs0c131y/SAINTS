# Fly.io app configuration. Deploy with `fly deploy` (builds the Dockerfile).
#
# Runtime secrets (optional): `fly secrets set REVALIDATE_SECRET=...` to enable POST /api/revalidate.

app = 'saints'
primary_region = 'sin'

[build]

[env]
  SHEET_REVALIDATE_SECONDS = '60'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
